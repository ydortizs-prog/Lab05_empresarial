<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Quiz Django{% endblock %}</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; background: #f4f6f8; }
        .container { max-width: 1200px; margin: 0 auto; padding: 2rem; }
        nav { background: #2c3e50; padding: 1rem; }
        nav a { color: white; margin-right: 1rem; text-decoration: none; }
        .content { background: white; margin-top: 2rem; padding: 2rem; border-radius: 8px; }
        .btn { display: inline-block; padding: 0.5rem 1rem; background: #3498db; color: white; text-decoration: none; border-radius: 4px; }
        .btn:hover { background: #2980b9; }
    </style>
</head>
<body>
    <nav>
        <div class="container">
            <a href="{% url 'exam_list' %}">Inicio</a>
            <a href="{% url 'admin:index' %}">Admin</a>
        </div>
    </nav>
    <div class="container">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
