{% extends "quiz/base.html" %}

{% block title %}Lista de Exámenes{% endblock %}

{% block content %}
<h1>Lista de Exámenes</h1>
<a href="{% url 'question_create' exam_id=1 %}" class="btn">Crear Pregunta</a>
<ul>
    {% for exam in exams %}
    <li>
        <a href="{% url 'exam_detail' exam.id %}">{{ exam.title }}</a> 
        ({{ exam.questions.count }} preguntas)
    </li>
    {% empty %}
    <li>No hay exámenes aún.</li>
    {% endfor %}
</ul>
{% endblock %}
